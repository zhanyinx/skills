name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # pytest is a test-only dependency. Nothing a skill ships imports it, and
      # the runtime is the standard library alone.
      - run: pip install pytest
      - run: pytest
